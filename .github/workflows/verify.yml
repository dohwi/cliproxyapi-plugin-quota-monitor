name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
      - name: Verify module
        run: make verify
      - name: Verify native plugin ABI
        run: scripts/build-native.sh
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # The plugin is a CGO c-shared library, so each store platform must build and pass the
  # native ABI smoke test on its own runner. Catching a broken platform here keeps it from
  # surfacing only when a release tag is pushed.
  native:
    name: Native ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin,  goarch: amd64, runner: macos-15-intel }
          - { goos: darwin,  goarch: arm64, runner: macos-15 }
          - { goos: windows, goarch: amd64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.mod
      - name: Confirm runner platform
        run: |
          echo "GOOS=$(go env GOOS) GOARCH=$(go env GOARCH)"
          [ "$(go env GOOS)" = "${{ matrix.goos }}" ] && [ "$(go env GOARCH)" = "${{ matrix.goarch }}" ]
      - name: Tests (no race detector off Linux amd64 to keep runners fast)
        run: go test -count=1 -timeout=300s ./...
      - name: Build and smoke-test the native plugin
        run: scripts/build-native.sh
