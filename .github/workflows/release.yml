name: Release

# Bumping pluginVersion in internal/plugin/plugin.go on main publishes vX.Y.Z automatically:
# the tag is created only after all five store platforms built and passed the native smoke
# test, so a partial release can never be published. The CLIProxyAPI plugin store reads the
# latest GitHub Release, so no registry change is needed. A manually pushed vX.Y.Z tag and
# workflow_dispatch also work.
on:
  push:
    branches: [main]
    paths: ['internal/plugin/plugin.go']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            ver="$(sed -nE 's/^[[:space:]]*pluginVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/plugin/plugin.go | head -n1)"
            [[ -n "$ver" ]] || { echo "could not read pluginVersion" >&2; exit 1; }
            tag="v${ver}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify (tag, tests, vulnerabilities)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
      - name: Tag matches source version
        run: scripts/check-release-version.sh "${{ needs.prepare.outputs.tag }}"
      - name: Verify
        run: make verify
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, verify]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux,   goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin,  goarch: amd64, runner: macos-15-intel }
          - { goos: darwin,  goarch: arm64, runner: macos-15 }
          - { goos: windows, goarch: amd64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.mod
      - name: Windows toolchain (mingw-w64 gcc, 64-bit)
        if: matrix.goos == 'windows'
        run: |
          # The runner's default gcc must be the 64-bit mingw one Go's cgo links with.
          command -v gcc && gcc --version | head -1
          gcc -dumpmachine | grep -q x86_64 || { echo "gcc is not x86_64 mingw" >&2; exit 1; }
      - name: Confirm runner platform
        run: |
          echo "GOOS=$(go env GOOS) GOARCH=$(go env GOARCH) CGO_ENABLED=$(go env CGO_ENABLED)"
          [ "$(go env GOOS)" = "${{ matrix.goos }}" ] && [ "$(go env GOARCH)" = "${{ matrix.goarch }}" ]
      - name: Build and smoke-test the native plugin
        run: scripts/build-native.sh
      - name: Package for the CLIProxyAPI plugin store
        run: |
          case "${{ matrix.goos }}" in linux) ext=so;; darwin) ext=dylib;; windows) ext=dll;; esac
          scripts/package-release.sh "${{ needs.prepare.outputs.tag }}" "${{ matrix.goos }}" "${{ matrix.goarch }}" "artifacts/quota-monitor.${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: quota-monitor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quota-monitor-*
          path: release
          merge-multiple: true
      - name: Verify all five platforms and write checksums.txt
        run: scripts/make-checksums.sh "${{ needs.prepare.outputs.tag }}" release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag at the built commit when it does not exist yet.
          gh release create "${{ needs.prepare.outputs.tag }}" release/*.zip release/checksums.txt \
            --title "${{ needs.prepare.outputs.tag }}" --generate-notes --target "${GITHUB_SHA}"
