<body>
<div class="container">
  <section id="authGate" class="auth-gate" style="display:none;" aria-labelledby="authGateTitle">
    <h2 id="authGateTitle" data-i18n="auth.title">관리 키가 필요합니다</h2>
    <p class="auth-gate-desc" data-i18n="auth.desc">쿼터 데이터는 관리 인증이 필요합니다. 관리 키는 이 탭의 세션에만 보관되며 주소나 서버에 기록되지 않습니다.</p>
    <form id="authForm" class="auth-gate-form" novalidate>
      <label class="sr-only" for="authKeyInput" data-i18n="auth.label">관리 키</label>
      <input id="authKeyInput" class="input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="512">
      <button type="submit" class="btn btn-secondary" data-i18n="auth.submit">확인</button>
    </form>
    <p id="authMessage" class="auth-gate-message" style="display:none;" role="alert"></p>
  </section>

  <header class="page-heading">
    <div class="page-heading-copy"><h1 data-i18n="page.heading">계정 쿼터</h1><p data-i18n="page.subheading">계정별 남은 쿼터와 초기화 시간을 한눈에 확인하세요.</p></div>
  </header>
  <div id="unconfiguredBox" class="warning-box" style="display:none;" role="alert">
    <span id="unconfiguredText">환경변수 미설정 (QUOTA_MONITOR_MGMT_URL, QUOTA_MONITOR_MGMT_KEY)</span>
  </div>
  <div id="staleNoticeBox" class="stale-notice" style="display:none;" role="status">
    <span id="staleNoticeText">데이터 갱신 실패로 이전 데이터를 표시 중입니다.</span>
    <button type="button" class="btn btn-secondary" onclick="loadDashboard(false)" aria-label="데이터 다시 시도" data-i18n="retry" data-i18n-aria="retry.aria">다시 시도</button>
  </div>
  <div id="errorBox" class="error-box" style="display:none;" role="alert" aria-live="assertive"></div>
  <div id="accountStatusLive" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div id="dashboardContent" style="display:none;">
    <div class="dashboard-control-panel" role="toolbar" aria-label="대시보드 컨트롤" data-i18n-aria="toolbar.aria">
      <div class="toolbar">
        <div class="filter-field">
          <label for="providerFilter" data-i18n="filter.provider">프로바이더</label>
          <div class="compact-select-wrap">
            <select id="providerFilter" class="compact-select" aria-label="Provider 필터" data-i18n-aria="filter.providerAria">
              <option value="all" data-i18n="all">전체</option>
            </select>
          </div>
        </div>
        <div class="filter-field filter-endpoint-field">
          <label for="endpointFilter" data-i18n="filter.endpoint">엔드포인트</label>
          <div class="compact-select-wrap">
            <select id="endpointFilter" class="compact-select" aria-label="Endpoint 필터" data-i18n-aria="filter.endpointAria">
              <option value="all" data-i18n="all">전체</option>
              <option value="direct">Direct</option>
              <option value="warp1">WARP 1</option>
              <option value="warp2">WARP 2</option>
            </select>
          </div>
        </div>
        <div class="filter-field filter-status-field">
          <label for="statusFilter" data-i18n="filter.status">상태</label>
          <div class="compact-select-wrap">
            <select id="statusFilter" class="compact-select" aria-label="상태 필터" data-i18n-aria="filter.statusAria">
              <option value="all" data-i18n="all">전체</option>
              <option value="active" data-i18n="st.active">활성</option>
              <option value="pending" data-i18n="st.pending">측정 대기</option>
              <option value="limited" data-i18n="st.limited">제한됨</option>
              <option value="warning" data-i18n="st.warning">주의</option>
              <option value="error" data-i18n="st.error">오류</option>
              <option value="disabled" data-i18n="st.disabled">비활성</option>
              <option value="stale">Stale</option>
              <option value="unknown" data-i18n="st.unknown">미확인</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button type="button" class="btn btn-secondary filter-reset-button" id="resetFiltersBtn" aria-label="쿼터 필터 초기화" data-i18n="filter.reset" data-i18n-aria="filter.resetAria">초기화</button>
          <button type="button" class="btn btn-secondary filter-reset-button" id="fullRefreshBtn" data-i18n="refresh.all">전체 갱신</button>
          <div class="filter-language-field">
            <button type="button" class="lang-toggle" id="languageToggle" aria-label="English" title="English"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h9M8.5 3v2M6 5c.6 3.2 2.700 5.600 5.500 7M11.500 5c-.6 3.200-3 6-6.500 7.500"/><path d="M12.500 20l4.500-10 4.500 10M14 16.500h6"/></svg></button>
          </div>
        </div>
      </div>
      <div id="manualRefreshStatus" class="manual-refresh-status" role="status" aria-live="polite"></div>
    </div>

    <ul id="fleetAvailability" class="fleet-availability" aria-label="전체 가용률" data-i18n-aria="fleet.aria"></ul>

    <div id="accountsList" class="cards-grid" role="region" aria-label="계정 목록" data-i18n-aria="accounts.aria"></div>
  </div>
</div>

      if (!node || !node.classList) return;
      node.style.setProperty('--enter-delay', Math.min(index, 8) * 40 + 'ms');
      node.classList.remove('is-entering');
      void node.offsetWidth;
      node.classList.add('is-entering');
      var done = function() { node.classList.remove('is-entering'); node.style.removeProperty('--enter-delay'); node.removeEventListener('animationend', done); };
      node.addEventListener('animationend', done);
    });
  };
  var enterNext = true;
  document.addEventListener('change', function(event) { if (event.target && event.target.id && /Filter$/.test(event.target.id)) enterNext = true; }, true);
  document.addEventListener('click', function(event) { if (event.target.closest && event.target.closest('#resetFiltersBtn')) enterNext = true; }, true);
  window.motionConsumeEnter = function() {
    if (!enterNext) return;
    var cards = document.querySelectorAll('#accountsList > .account-card');
    if (!cards.length) return;
    enterNext = false;
    window.motionEnter(cards);
  };
})();
</script>
</body>
</html>
